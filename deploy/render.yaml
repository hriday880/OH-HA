# ==============================================================================
# Render Blueprint Configuration
# Free-Tier Cloud Deployment for OpenHuman & Hermes Telegram Companion
# ==============================================================================
version: "1"
services:
  - type: web
    name: openhuman-hermes-bot
    runtime: docker
    dockerfilePath: deploy/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_TELEGRAM_USER_IDS
        sync: false
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: nousresearch/hermes-3-llama-3.1-8b
      - key: LLM_API_KEY
        sync: false
      - key: GIT_REMOTE_URL
        sync: false
      - key: GIT_AUTH_TOKEN
        sync: false
      - key: GIT_BRANCH
        value: main
      - key: VAULT_PATH
        value: /app/vault
      - key: AUTO_SYNC_INTERVAL_SECONDS
        value: "1800"
      - key: PORT
        value: "8080"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_REASONING_STEPS
        value: "5"
