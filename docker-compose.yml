version: '3.8'
services:
  bot:
    build: .
    ports:
      - "8080:8080"
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - OPENHUMAN_API_KEY=${OPENHUMAN_API_KEY}
      - HERMES_API_KEY=${HERMES_API_KEY}
      - OBSIDIAN_GIT_URL=${OBSIDIAN_GIT_URL}
      - OBSIDIAN_GIT_TOKEN=${OBSIDIAN_GIT_TOKEN}
    restart: unless-stopped
